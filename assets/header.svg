<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Malek M. Elkssas. Full-stack TypeScript engineer. I fix bugs upstream.">
<!-- Animated GitHub profile header. Mark = portfolio/brand/logo.svg (Canva design DAHYwGSSvxw, traced). -->
<style>
  .bg{fill:#0d0b0b}
  .glow{fill:url(#g);opacity:.9;animation:drift 9s ease-in-out infinite alternate}
  .name{font:700 64px "Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#f2eded;letter-spacing:-1.5px}
  .tag{font:500 22px "SFMono-Regular",Consolas,"Liberation Mono",monospace;fill:#a59c9c}
  .tag tspan.r{fill:#ff8090}
  .caret{fill:#d42a3c;animation:blink 1.1s steps(1) infinite}
  .paths{transform-box:fill-box;transform-origin:center;animation:in .9s cubic-bezier(.22,1,.36,1) both}
  .arrow{animation:merge 3.2s cubic-bezier(.22,1,.36,1) infinite}
  .fade{animation:fade 1s ease both .35s}
  .label{font:600 14px "SFMono-Regular",Consolas,monospace;fill:#ff8090;letter-spacing:3px}
  .small{font:500 15px "SFMono-Regular",Consolas,monospace;fill:#7d7373}
  .chip{animation:pop .6s cubic-bezier(.22,1,.36,1) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes in{from{opacity:0;transform:scale(.6) rotate(-25deg)}to{opacity:1;transform:none}}
  @keyframes merge{0%{opacity:0;transform:translateX(-220px)}25%{opacity:1}45%,85%{opacity:1;transform:none}100%{opacity:0;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
